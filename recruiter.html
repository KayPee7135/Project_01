<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recruiter - Post Job</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4">Post a New Job</h2>
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <form id="jobForm">
          <div class="mb-3">
            <input type="text" id="title" class="form-control" placeholder="Job Title" />
          </div>
          <div class="mb-3">
            <input type="text" id="company" class="form-control" placeholder="Company Name" />
          </div>
          <div class="mb-3">
            <input type="text" id="address" class="form-control" placeholder="Company Address" />
          </div>
          <div class="mb-3">
            <select id="jobType" class="form-control">
              <option value="" disabled selected>Select Job Type</option>
              <option value="Internship">Internship</option>
              <option value="Full-Time">Full-Time</option>
              <option value="Temporary">Temporary</option>
            </select>
          </div>
          <div class="mb-3">
            <textarea id="description" class="form-control" placeholder="Brief Description about the Job" rows="4"></textarea>
          </div>
          <div class="mb-3">
            <input type="text" id="contact" class="form-control" placeholder="Contact Information (Email)" />
          </div>
          <div class="mb-3">
            <input type="file" id="image" class="form-control" accept="image/*" />
          </div>
          <div class="mb-3">
            <input type="text" id="category" class="form-control" placeholder="Category (e.g., IT, 3rd Year)" />
          </div>
          <div class="mb-3">
            <label for="datePosted" class="form-label">Date Posted</label>
            <input type="date" id="datePosted" class="form-control" />
          </div>
          <div class="mb-3">
            <label for="dueDate" class="form-label">Due Date</label>
            <input type="date" id="dueDate" class="form-control" />
          </div>
          <button type="submit" class="btn btn-success w-100">Post Job</button>
        </form>
        <div id="message" class="mt-3 text-success text-center"></div>
        <div class="text-center mt-4">
          <a href="homepage.html" class="btn btn-link">Back to Home</a>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
