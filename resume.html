<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Resume</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="container">
    <!-- Job Details Section -->
    <div id="jobDetails" class="alert alert-info text-center mb-4" style="display: none;"></div>

    <h1 class="text-center mb-4">Submit Your Resume</h1>
    <form id="resumeForm" class="p-4 border rounded">
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" id="phone" class="form-control" placeholder="Enter your phone number" required>
      </div>
      <div class="mb-3">
        <label for="resume" class="form-label">Upload Resume</label>
        <input type="file" id="resume" class="form-control" accept=".pdf,.doc,.docx" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Submit Application</button>
      <p id="message" class="mt-3 text-center"></p>
    </form>

    <!-- Back to Homepage Button -->
    <div class="text-center mt-4">
      <a href="homepage.html" class="btn btn-secondary">Back to Homepage</a>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
